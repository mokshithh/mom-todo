<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My To-Do List</title>
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23302b;--muted:#6b766f;--accent:#2f6f5e;--accent-ink:#fff;--line:#e4dccb;--danger:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#171c1a;--card:#212825;--ink:#eef2ee;--muted:#9aa8a0;--accent:#5fb89c;--accent-ink:#0e1713;--line:#33403a;--danger:#e8806f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 18px}
h1{font-size:32px;margin:0}
#count{color:var(--muted);font-size:18px}
h2{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h2[hidden]{display:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 4px;min-height:68px}
li.done .txt{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:60px;height:60px;border:0;background:none;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.chk span{width:34px;height:34px;border:3px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);font-size:22px;font-weight:700;transition:background .15s}
li.done .chk span{background:var(--accent)}
li.done .chk span::after{content:"✓"}
.txt{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;padding:10px 4px;text-align:left;border-radius:8px}
.txt:focus{outline:3px solid var(--accent)}
.del{flex:none;width:52px;height:52px;border:0;background:none;color:var(--muted);font-size:26px;cursor:pointer;border-radius:50%}
.del:active{color:var(--danger)}
li.empty{display:block;border:0;background:none;color:var(--muted);text-align:center;padding:28px 0}
#clear{background:none;border:0;color:var(--danger);font:inherit;font-size:16px;text-transform:none;letter-spacing:0;padding:10px 8px;cursor:pointer}
form{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.row{max-width:640px;margin:0 auto;display:flex;gap:10px}
#in{flex:1;min-width:0;font:inherit;padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
#in:focus{outline:none;border-color:var(--accent)}
#add{flex:none;font:inherit;font-weight:700;padding:0 24px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#add:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;display:none;gap:14px;align-items:center;font-size:18px;z-index:5}
#toast.show{display:flex}
#toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>
  <header><h1>My To-Do List</h1><span id="count"></span></header>
  <ul id="todo" aria-label="Things to do"></ul>
  <h2 id="doneHead" hidden><span>Done</span><button id="clear" type="button">Clear done</button></h2>
  <ul id="done" aria-label="Finished things"></ul>
</main>
<form id="f" autocomplete="off">
  <div class="row">
    <input id="in" placeholder="Add a new task…" enterkeyhint="done" aria-label="New task" maxlength="200">
    <button id="add" type="submit">Add</button>
  </div>
</form>
<div id="toast" role="status"><span id="toastMsg"></span><button id="undo" type="button">Undo</button></div>
<script>
(function(){
  var KEY="mom-todo-v1", tasks=[], lastDeleted=null, toastTimer;
  try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
  var $=function(id){return document.getElementById(id)};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function toast(msg){
    $("toastMsg").textContent=msg;
    $("toast").classList.add("show"); clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){$("toast").classList.remove("show");lastDeleted=null},5000);
  }
  function item(t){
    var li=document.createElement("li"); if(t.done) li.className="done";
    var c=document.createElement("button"); c.className="chk"; c.type="button";
    c.setAttribute("aria-label",(t.done?"Mark not done: ":"Mark done: ")+t.text);
    c.innerHTML="<span></span>"; c.onclick=function(){t.done=!t.done;t.at=Date.now();save();render()};
    var x=document.createElement("input"); x.className="txt"; x.value=t.text; x.setAttribute("aria-label","Task text"); x.maxLength=200;
    x.onchange=function(){var v=x.value.trim(); if(v){t.text=v;save()} else x.value=t.text};
    x.onkeydown=function(e){if(e.key==="Enter")x.blur()};
    var d=document.createElement("button"); d.className="del"; d.type="button"; d.textContent="🗑"; d.setAttribute("aria-label","Delete: "+t.text);
    d.onclick=function(){lastDeleted={t:t,i:tasks.indexOf(t)};tasks=tasks.filter(function(y){return y!==t});save();render();toast("Task deleted")};
    li.append(c,x,d); return li;
  }
  function render(){
    var open=tasks.filter(function(t){return !t.done}), done=tasks.filter(function(t){return t.done}).sort(function(a,b){return b.at-a.at});
    var a=$("todo"), b=$("done"); a.textContent=""; b.textContent="";
    if(!open.length){var e=document.createElement("li");e.className="empty";e.textContent=tasks.length?"All done! 🎉":"Nothing to do yet. Add a task below.";a.appendChild(e)}
    open.forEach(function(t){a.appendChild(item(t))});
    done.forEach(function(t){b.appendChild(item(t))});
    $("doneHead").hidden=!done.length;
    $("count").textContent=open.length?open.length+" to do":"";
  }
  $("f").onsubmit=function(e){
    e.preventDefault(); var v=$("in").value.trim(); if(!v)return;
    tasks.push({id:uid(),text:v,done:false,at:Date.now()}); $("in").value=""; save(); render(); $("in").focus();
  };
  $("undo").onclick=function(){if(lastDeleted){tasks.splice(Math.min(lastDeleted.i,tasks.length),0,lastDeleted.t);lastDeleted=null;save();render()}$("toast").classList.remove("show")};
  $("clear").onclick=function(){
    if(!tasks.some(function(t){return t.done}))return;
    if(!confirm("Remove all finished tasks?"))return;
    tasks=tasks.filter(function(t){return !t.done}); save(); render();
  };
  render();
  if("serviceWorker" in navigator) addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
</html>
