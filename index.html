<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My To-Do List</title>
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#23302b;--muted:#6b766f;--accent:#2f6f5e;--accent-ink:#fff;--line:#e4dccb;--danger:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#171c1a;--card:#212825;--ink:#eef2ee;--muted:#9aa8a0;--accent:#5fb89c;--accent-ink:#0e1713;--line:#33403a;--danger:#e8806f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu","Nirmala UI",sans-serif;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 18px}
h1{font-size:32px;line-height:1.2;margin:0}
#count{color:var(--muted);font-size:18px;min-height:26px}
#lang{flex:none;font:inherit;font-size:18px;font-weight:700;color:var(--accent);background:var(--card);border:2px solid var(--accent);border-radius:999px;padding:8px 16px;min-height:48px;cursor:pointer}
h2{font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:center}
h2[hidden]{display:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 4px;min-height:68px}
li.done .txt{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:60px;height:60px;border:0;background:none;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.chk span{width:34px;height:34px;border:3px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent-ink);font-size:22px;font-weight:700;transition:background .15s}
li.done .chk span{background:var(--accent)}
li.done .chk span::after{content:"✓"}
.txt{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;padding:10px 4px;text-align:left;border-radius:8px;resize:none;overflow:hidden;display:block;height:auto}
.txt:focus{outline:3px solid var(--accent)}
.del{flex:none;width:52px;height:52px;border:0;background:none;color:var(--muted);font-size:26px;cursor:pointer;border-radius:50%}
.del:active{color:var(--danger)}
li.empty{display:block;border:0;background:none;color:var(--muted);text-align:center;padding:28px 0}
#clear{background:none;border:0;color:var(--danger);font:inherit;font-size:16px;text-transform:none;letter-spacing:0;padding:10px 8px;cursor:pointer}
form{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.row{max-width:640px;margin:0 auto;display:flex;gap:10px}
#in{flex:1;min-width:0;font:inherit;padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
#in:focus{outline:none;border-color:var(--accent)}
#add{flex:none;font:inherit;font-weight:700;padding:0 20px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#add:active{transform:scale(.97)}
#mic{flex:none;width:60px;border:2px solid var(--accent);border-radius:16px;background:var(--card);color:var(--accent);font-size:28px;cursor:pointer}
#mic.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(179,64,47,.25)}}
#live{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;background:var(--card);border:2px solid var(--danger);border-radius:16px;padding:14px 16px;display:none;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#live.show{display:block}
#liveHead{font-weight:700;color:var(--danger)}
#liveText{margin-top:6px;min-height:28px;overflow-wrap:anywhere}
#liveHint{color:var(--muted);font-size:16px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;display:none;gap:14px;align-items:center;font-size:18px;z-index:5;width:max-content;max-width:calc(100vw - 32px)}
#toast.show{display:flex}
#toast button{white-space:nowrap;background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main>
  <header>
    <div><h1 data-i18n="title"></h1><div id="count"></div></div>
    <button id="lang" type="button"></button>
  </header>
  <ul id="todo"></ul>
  <h2 id="doneHead" hidden><span data-i18n="done"></span><button id="clear" type="button" data-i18n="clear"></button></h2>
  <ul id="done"></ul>
</main>
<div id="live" role="status"><div id="liveHead"></div><div id="liveText"></div><div id="liveHint"></div></div>
<form id="f" autocomplete="off">
  <div class="row">
    <input id="in" enterkeyhint="done" maxlength="200" data-i18n-ph="ph" data-i18n-aria="ph">
    <button id="mic" type="button" data-i18n-aria="mic">🎤</button>
    <button id="add" type="submit" data-i18n="add"></button>
  </div>
</form>
<div id="toast" role="status"><span id="toastMsg"></span><button id="undo" type="button" data-i18n="undo"></button></div>
<script>
(function(){
  var STR={
    en:{title:"My To-Do List",ph:"Add a new task…",add:"Add",done:"Done",clear:"Clear done",undo:"Undo",
      count:"{n} to do",empty:"Nothing to do yet. Add a task below.",allDone:"All done! 🎉",
      deleted:"Task deleted",confirmClear:"Remove all finished tasks?",
      markDone:"Mark done: ",markUndone:"Mark not done: ",del:"Delete: ",taskText:"Task text",
      mic:"Speak your tasks",langBtn:"తెలుగు",
      listening:"🎤 Listening… speak your tasks",liveHint:"Tap the red mic when you are finished",
      added:"{n} task(s) added",nothing:"Didn't hear anything. Try again.",
      noVoice:"Voice isn't available on this phone. Use the 🎤 on your keyboard instead.",
      denied:"Please allow the microphone, then try again.",
      netErr:"Voice needs internet. Try again when online."},
    te:{title:"నా పనుల జాబితా",ph:"కొత్త పని…",add:"జోడించు",done:"పూర్తయినవి",clear:"పూర్తయినవి తొలగించు",undo:"రద్దు చేయి",
      count:"{n} పనులు చేయాలి",empty:"ఇంకా పనులు లేవు. కింద ఒక పని జోడించండి.",allDone:"అన్నీ పూర్తయ్యాయి! 🎉",
      deleted:"పని తొలగించబడింది",confirmClear:"పూర్తయిన పనులన్నీ తొలగించాలా?",
      markDone:"పూర్తయింది అని గుర్తించండి: ",markUndone:"ఇంకా పూర్తి కాలేదు అని గుర్తించండి: ",del:"తొలగించు: ",taskText:"పని వివరం",
      mic:"మీ పనులు చెప్పండి",langBtn:"English",
      listening:"🎤 వింటున్నాను… మీ పనులు చెప్పండి",liveHint:"పూర్తయ్యాక ఎర్ర మైక్ నొక్కండి",
      added:"{n} పనులు జోడించబడ్డాయి",nothing:"ఏమీ వినిపించలేదు. మళ్లీ ప్రయత్నించండి.",
      noVoice:"ఈ ఫోన్‌లో వాయిస్ పనిచేయదు. బదులుగా కీబోర్డ్‌లోని 🎤 వాడండి.",
      denied:"దయచేసి మైక్రోఫోన్ అనుమతి ఇచ్చి, మళ్లీ ప్రయత్నించండి.",
      netErr:"వాయిస్‌కు ఇంటర్నెట్ కావాలి. ఆన్‌లైన్‌లో ఉన్నప్పుడు ప్రయత్నించండి."}
  };
  var KEY="mom-todo-v1", LKEY="mom-todo-lang", tasks=[], lang="en", lastUndo=null, toastTimer;
  try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
  try{lang=localStorage.getItem(LKEY)||((navigator.language||"").indexOf("te")===0?"te":"en")}catch(e){}
  if(!STR[lang]) lang="en";
  var $=function(id){return document.getElementById(id)};
  function t(k,n){var s=STR[lang][k]; return n==null?s:s.replace("{n}",n)}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

  function toast(msg,undo){
    $("toastMsg").textContent=msg; lastUndo=undo||null; $("undo").style.display=undo?"":"none";
    $("toast").classList.add("show"); clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){$("toast").classList.remove("show");lastUndo=null},6000);
  }
  $("undo").onclick=function(){var u=lastUndo; lastUndo=null; $("toast").classList.remove("show"); if(u)u()};

  function item(k){
    var li=document.createElement("li"); if(k.done) li.className="done";
    var c=document.createElement("button"); c.className="chk"; c.type="button";
    c.setAttribute("aria-label",(k.done?t("markUndone"):t("markDone"))+k.text);
    c.innerHTML="<span></span>"; c.onclick=function(){k.done=!k.done;k.at=Date.now();save();render()};
    var x=document.createElement("textarea"); x.rows=1; x.className="txt"; x.value=k.text; x.oninput=function(){fit(x)}; x.setAttribute("aria-label",t("taskText")); x.maxLength=200;
    x.onchange=function(){var v=x.value.trim(); if(v){k.text=v;save()} else x.value=k.text};
    x.onkeydown=function(e){if(e.key==="Enter")x.blur()};
    var d=document.createElement("button"); d.className="del"; d.type="button"; d.textContent="🗑"; d.setAttribute("aria-label",t("del")+k.text);
    d.onclick=function(){
      var i=tasks.indexOf(k); tasks=tasks.filter(function(y){return y!==k}); save(); render();
      toast(t("deleted"),function(){tasks.splice(Math.min(i,tasks.length),0,k);save();render()});
    };
    li.append(c,x,d); return li;
  }
  function fit(x){x.style.height="auto";x.style.height=x.scrollHeight+"px"}
  function render(){
    var open=tasks.filter(function(k){return !k.done}), done=tasks.filter(function(k){return k.done}).sort(function(a,b){return b.at-a.at});
    var a=$("todo"), b=$("done"); a.textContent=""; b.textContent="";
    if(!open.length){var e=document.createElement("li");e.className="empty";e.textContent=tasks.length?t("allDone"):t("empty");a.appendChild(e)}
    open.forEach(function(k){a.appendChild(item(k))});
    done.forEach(function(k){b.appendChild(item(k))});
    $("doneHead").hidden=!done.length;
    $("count").textContent=open.length?t("count",open.length):"";
    document.querySelectorAll(".txt").forEach(fit);
  }
  function applyLang(){
    document.documentElement.lang=lang; document.title=t("title");
    document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"))});
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){el.placeholder=t(el.getAttribute("data-i18n-ph"))});
    document.querySelectorAll("[data-i18n-aria]").forEach(function(el){el.setAttribute("aria-label",t(el.getAttribute("data-i18n-aria")))});
    $("lang").textContent=t("langBtn"); $("lang").setAttribute("lang",lang==="te"?"en":"te");
    $("liveHead").textContent=t("listening"); $("liveHint").textContent=t("liveHint");
    render();
  }
  $("lang").onclick=function(){
    if(listening) stopVoice();
    lang=lang==="en"?"te":"en"; try{localStorage.setItem(LKEY,lang)}catch(e){} applyLang();
  };

  function addTasks(texts,withUndo){
    var made=texts.map(function(s){return {id:uid(),text:s,done:false,at:Date.now()}});
    if(!made.length) return;
    tasks=tasks.concat(made); save(); render();
    if(withUndo) toast(t("added",made.length),function(){
      tasks=tasks.filter(function(k){return made.indexOf(k)<0}); save(); render();
    });
  }
  $("f").onsubmit=function(e){
    e.preventDefault(); var v=$("in").value.trim(); if(!v)return;
    addTasks([v]); $("in").value=""; $("in").focus();
  };
  $("clear").onclick=function(){
    if(!tasks.some(function(k){return k.done}))return;
    if(!confirm(t("confirmClear")))return;
    tasks=tasks.filter(function(k){return !k.done}); save(); render();
  };

  /* ---- Voice ---- */
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, listening=false, stopping=false;
  var current=[], banked=[], restarts=0, voiceErr="";
  var FATAL={"not-allowed":1,"service-not-allowed":1,"audio-capture":1,"network":1,"language-not-supported":1};
  var SPLIT=/\s*(?:[,.;।]|\b(?:and then|and also|then|also|and)\b|మరియు|ఆ తర్వాత|తర్వాత|ఇంకా)\s*/i;
  var LEAD=/^(?:please\s+)?(?:add|remind me to|i need to|i have to|i must)\s+/i;
  function norm(s){return s.toLowerCase().replace(/\s+/g," ").trim()}
  // Android/Chrome re-sends the same words as growing or repeated results; merge those into one.
  function collapse(list){
    var out=[];
    list.forEach(function(raw){
      var s=raw.trim(); if(!s) return;
      var last=out[out.length-1];
      if(last){
        var a=norm(last), b=norm(s);
        if(b.indexOf(a)===0){out[out.length-1]=s; return}
        if(a.indexOf(b)===0) return;
      }
      out.push(s);
    });
    return out;
  }
  function allChunks(){return banked.concat(collapse(current))}
  function parse(chunks){
    var out=[], seen={};
    chunks.forEach(function(c){
      c.split(SPLIT).forEach(function(p){
        p=p.trim().replace(LEAD,"").trim();
        if(p.length<2||seen[norm(p)]) return;
        seen[norm(p)]=1; out.push(p.charAt(0).toUpperCase()+p.slice(1));
      });
    });
    return out;
  }
  function showLive(){$("liveText").textContent=allChunks().join(" · ")}
  function setListening(on){
    listening=on; $("mic").classList.toggle("on",on); $("live").classList.toggle("show",on);
    $("mic").setAttribute("aria-pressed",on?"true":"false");
    if(on){$("liveText").textContent="";$("toast").classList.remove("show")}
  }
  function finish(){
    var list=parse(allChunks()), err=voiceErr;
    setListening(false); rec=null; current=[]; banked=[];
    if(list.length){addTasks(list,true)}
    else if(err==="service-not-allowed"){toast(t("noVoice"))}
    else if(err==="not-allowed"||err==="audio-capture"){toast(t("denied"))}
    else if(err==="network"){toast(t("netErr"))}
    else toast(t("nothing"));
  }
  function startVoice(){
    if(!SR){toast(t("noVoice"));return}
    voiceErr=""; current=[]; banked=[]; restarts=0; stopping=false;
    try{
      rec=new SR(); rec.lang=lang==="te"?"te-IN":"en-IN"; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
      rec.onresult=function(e){
        current=[];
        for(var i=0;i<e.results.length;i++){current.push(e.results[i][0].transcript)}
        showLive();
      };
      rec.onerror=function(e){voiceErr=e.error||"error"};
      rec.onend=function(){
        var quiet=voiceErr==="no-speech"&&restarts>=2&&!banked.length&&!current.length;
        if(!stopping&&!FATAL[voiceErr]&&!quiet&&restarts<20){
          banked=allChunks(); current=[]; voiceErr=""; restarts++;
          try{rec.start();return}catch(err){}
        }
        finish();
      };
      rec.start(); setListening(true);
    }catch(err){setListening(false);rec=null;toast(t("noVoice"))}
  }
  function stopVoice(){stopping=true; if(rec){try{rec.stop()}catch(e){finish()}}}
  $("mic").onclick=function(){listening?stopVoice():startVoice()};

  applyLang();
  if("serviceWorker" in navigator) addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
</html>
